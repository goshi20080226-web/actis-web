name: ACTIS Update Discord

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check update size
        id: check
        shell: bash
        run: |
          set -euo pipefail

          TAG="actis-update-notified"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            BASE="$TAG"
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            BASE=""
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$BASE" ]; then
            echo "surface_count=0" >> "$GITHUB_OUTPUT"
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 利用者から見てサイト上の変更につながるコミットだけを対象にする。
          # CI/API/依存関係/リファクタリング等の内部変更は除外する。
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ["git", "log", "--format=%H%x00%s%x00%b", f"{base}..HEAD"],
              text=True,
              encoding="utf-8"
          )

          commits = raw.split("\n\x00")
          surface = []
          internal_prefixes = (
              "chore", "ci", "build", "test", "refactor", "perf",
              "docs", "style", "deps", "dependency", "workflow"
          )
          surface_keywords = (
              "feat", "feature", "add", "added", "fix", "update",
              "変更", "修正", "追加", "実装", "改善", "新機能",
              "機能追加", "画面", "デザイン", "表示", "レイアウト",
              "ページ", "ボタン", "メニュー", "発車標", "時刻表"
          )

          for commit in commits:
              parts = commit.split("\x00", 2)
              if len(parts) < 2:
                  continue
              sha, subject = parts[0].strip(), parts[1].strip()
              lower = subject.lower()
              if not subject:
                  continue
              if lower.startswith(internal_prefixes):
                  continue
              if any(lower.startswith(k) or k in subject for k in surface_keywords):
                  surface.append(sha)

          count = len(surface)
          open("/tmp/surface_commits.txt", "w", encoding="utf-8").write("\n".join(surface))
          print(f"surface_count={count}")
          PY

          SURFACE_COUNT="$(wc -l < /tmp/surface_commits.txt | tr -d ' ')"
          echo "surface_count=$SURFACE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$SURFACE_COUNT" -ge 5 ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            FEATURE_COUNT="$(git log --format='%s' "$BASE..HEAD" | grep -Eic '^(feat|feature|add|added|fix|update|追加|実装|新機能|機能追加|変更|修正|改善)' || true)"
            if [ "$FEATURE_COUNT" -ge 1 ] && [ "$SURFACE_COUNT" -ge 1 ]; then
              echo "should_notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_notify=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Initialize notification marker
        if: steps.check.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified

      - name: Prepare change list
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          shas = [x for x in open("/tmp/surface_commits.txt", encoding="utf-8").read().splitlines() if x]
          lines = []

          for sha in shas:
              data = subprocess.check_output(
                  ["git", "show", "-s", "--format=%s%n%b", sha],
                  text=True,
                  encoding="utf-8"
              ).strip()
              if data:
                  lines.append(data)

          if not lines:
              raise SystemExit("利用者向けの変更が見つかりませんでした。")

          open("/tmp/changes.txt", "w", encoding="utf-8").write("\n\n".join(lines))
          PY

          echo "利用者向け変更:"
          cat /tmp/changes.txt

      - name: Prepare Japanese update text
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/changes.txt /tmp/update.txt

      - name: Send Discord notification
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_COUNT: ${{ steps.check.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          update = open("/tmp/update.txt", encoding="utf-8").read().strip()

          payload = {
              "username": "ACTIS Update",
              "embeds": [{
                  "title": "🚆 ACTIS Web アップデート",
                  "description": update,
                  "url": "https://actis-web.pages.dev/",
                  "footer": {
                      "text": f"ACTIS Web v0.1.0 • {os.environ['COMMIT_COUNT']}件の変更"
                  }
              }]
          }

          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              if response.status >= 300:
                  raise SystemExit(f"Discord returned HTTP {response.status}")
          PY

      - name: Move notification marker
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified
