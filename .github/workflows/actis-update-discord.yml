name: ACTIS Update Discord

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Discordへテスト文章を1回配信する"
        required: false
        default: false
        type: boolean
      previous_update:
        description: "直前のアップデート内容を1回配信する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test-notify:
    if: github.event_name == 'workflow_dispatch' && inputs.test_notification == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord test notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = {
              "username": "ACTIS Update",
              "embeds": [{
                  "title": "🚆 ACTIS Web アップデート（テスト）",
                  "description": "これはACTISのDiscord更新通知のテスト配信です。\n\n実際のサイト更新ではありません。",
                  "url": "https://actis-web.pages.dev/",
                  "footer": {
                      "text": "ACTIS Web v0.1.0 • テスト配信"
                  }
              }]
          }

          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
              "Content-Type": "application/json",
              "User-Agent": "ACTIS-Update/0.1.0"
          },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  if response.status >= 300:
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"Discord HTTP {error.code}")
              print(f"Discord response: {body}")
              raise
          PY

  previous-notify:
    if: github.event_name == 'workflow_dispatch' && inputs.previous_update == true && inputs.test_notification != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch notification marker
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/actis-update-notified:refs/tags/actis-update-notified" || true
          if ! git rev-parse --verify "refs/tags/actis-update-notified" >/dev/null 2>&1; then
            echo "通知済みアップデートの記録タグ actis-update-notified が見つかりません。"
            exit 1
          fi
      - name: Send previous update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 1; fi
          TAG="actis-update-notified"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then echo "通知済みアップデートの記録がありません。"; exit 1; fi
          PREV="$(git rev-parse "$TAG^")"
          python3 - <<PY
          import json, os, subprocess, urllib.error, urllib.request
          prev = "${PREV}"
          tag = "${TAG}"
          raw = subprocess.check_output(["git","log","--format=%H%x09%s",prev+".."+tag], text=True, encoding="utf-8")
          lines = [line.split("\t",1)[1].strip() for line in raw.splitlines() if "\t" in line]
          description = "\n".join("• "+x for x in lines) or "直前のアップデート内容を取得できませんでした。"
          if len(description) > 4000: description = description[:3997] + "..."
          payload = {"username":"ACTIS Update","embeds":[{"title":"🚆 ACTIS Web 直前アップデート","description":description,"url":"https://actis-web.pages.dev/","footer":{"text":"ACTIS Web • 直前アップデート配信"}}]}
          req=urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"],data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json","User-Agent":"ACTIS-Update/0.1.0"},method="POST")
          try:
              with urllib.request.urlopen(req) as response:
                  if response.status >= 300: raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"Discord HTTP {error.code}")
              print(f"Discord response: {body}")
              raise
          PY

  notify:
    if: github.event_name != 'workflow_dispatch' || (inputs.test_notification != true && inputs.previous_update != true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check update size
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TAG="actis-update-notified"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            BASE="$TAG"
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            BASE=""
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$BASE" ]; then
            echo "surface_count=0" >> "$GITHUB_OUTPUT"
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<PY
          import subprocess
          base = "${BASE}"
          raw = subprocess.check_output(["git", "log", "--format=%H%x09%s", base + "..HEAD"], text=True, encoding="utf-8")
          internal_prefixes = ("chore:", "ci:", "build:", "test:", "refactor:", "perf:", "docs:", "style:", "deps:", "dependency:", "workflow:")
          surface_keywords = ("feat:", "feature:", "add:", "added:", "fix:", "update:", "変更", "修正", "追加", "実装", "改善", "新機能", "機能追加", "画面", "デザイン", "表示", "レイアウト", "ページ", "ボタン", "メニュー", "発車標", "時刻表")
          surface = []
          for line in raw.splitlines():
              if "\t" not in line: continue
              sha, subject = line.split("\t", 1)
              lower = subject.lower().strip()
              if lower.startswith(internal_prefixes): continue
              if lower.startswith("merge "): continue
              surface.append(sha.strip())
          open("/tmp/surface_commits.txt", "w", encoding="utf-8").write("\n".join(surface))
          print(f"利用者向け変更: {len(surface)}件")
          PY
          SURFACE_COUNT="$(grep -c . /tmp/surface_commits.txt 2>/dev/null || true)"
          echo "surface_count=$SURFACE_COUNT" >> "$GITHUB_OUTPUT"
          echo "count=$SURFACE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$SURFACE_COUNT" -ge 1 ]; then echo "should_notify=true" >> "$GITHUB_OUTPUT"; else echo "should_notify=false" >> "$GITHUB_OUTPUT"; fi

      - name: Initialize notification marker
        if: steps.check.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified

      - name: Prepare change list
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          shas = [x for x in open("/tmp/surface_commits.txt", encoding="utf-8").read().splitlines() if x]
          lines = []

          for sha in shas:
              data = subprocess.check_output(
                  ["git", "show", "-s", "--format=%s%n%b", sha],
                  text=True,
                  encoding="utf-8"
              ).strip()
              if data:
                  lines.append(data)

          if not lines:
              raise SystemExit("利用者向けの変更が見つかりませんでした。")

          open("/tmp/changes.txt", "w", encoding="utf-8").write("\n\n".join(lines))
          PY

          echo "利用者向け変更:"
          cat /tmp/changes.txt

      - name: Prepare Japanese update text
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import subprocess

          shas = [x for x in open("/tmp/surface_commits.txt", encoding="utf-8").read().splitlines() if x]
          raw_lines = []

          for sha in shas:
              subject = subprocess.check_output(
                  ["git", "show", "-s", "--format=%s", sha],
                  text=True,
                  encoding="utf-8"
              ).strip()
              if subject:
                  raw_lines.append(subject)

          def jp(subject):
              s = subject.strip()
              # Remove common conventional-commit prefixes.
              s = re.sub(r"^(feat|feature|fix|add|added|update|improve|change|変更|修正|追加|実装|改善)\s*[:：]\s*", "", s, flags=re.I)

              rules = [
                  (r"shared dataset|共有ダイヤ|共有データセット", "共有ダイヤ・データセット機能を改善"),
                  (r"shared.*staff|staff.*shared|crew roster|スタフ|行路", "共有ダイヤからスタフ・行路を確認できるように改善"),
                  (r"departure board|発車標", "駅発車標を改善"),
                  (r"timetable|時刻表", "時刻表機能を改善"),
                  (r"train list|列車一覧", "列車一覧を改善"),
                  (r"line list|路線一覧", "路線一覧を改善"),
                  (r"login|sign.?in|authentication|認証|ログイン", "ログイン・認証機能を改善"),
                  (r"discord.*webhook|webhook", "Discord更新通知を改善"),
                  (r"privacy|プライバシー", "プライバシーポリシーを更新"),
                  (r"favicon|logo|ロゴ", "ロゴ・アイコンを更新"),
                  (r"version|バージョン", "バージョン表示を更新"),
                  (r"cloudflare|worker", "公開環境・サーバー処理を改善"),
                  (r"firebase|database|データベース", "データ保存・データベース処理を改善"),
                  (r"build error|jsx|syntax|構文|ビルド", "ビルド・表示上の不具合を修正"),
                  (r"css|style|design|layout|デザイン|レイアウト|スタイル", "画面デザイン・レイアウトを改善"),
                  (r"button|menu|ボタン|メニュー", "操作画面を改善"),
              ]
              for pattern, text in rules:
                  if re.search(pattern, s, flags=re.I):
                      return text
              # Keep already-Japanese user-facing messages, but make them concise.
              if re.search(r"[ぁ-んァ-ヶ一-龠]", s):
                  s = re.sub(r"^(fix|feat|chore|ci|build|docs|style|refactor)\s*[:：]\s*", "", s, flags=re.I)
                  return s[:80]
              return None

          items = []
          seen = set()
          for subject in raw_lines:
              item = jp(subject)
              if item and item not in seen:
                  seen.add(item)
                  items.append(item)

          # Prefer a compact, user-facing update rather than exposing commit history.
          sections = []
          category_rules = [
              ("📊 共有・ダイヤ", ("共有ダイヤ・データセット機能を改善", "共有ダイヤからスタフ・行路を確認できるように改善")),
              ("🚆 鉄道機能", ("駅発車標を改善", "時刻表機能を改善", "列車一覧を改善", "路線一覧を改善")),
              ("🔐 アカウント・データ", ("ログイン・認証機能を改善", "データ保存・データベース処理を改善")),
              ("🔧 改善・修正", ("Discord更新通知を改善", "ビルド・表示上の不具合を修正", "画面デザイン・レイアウトを改善", "操作画面を改善", "公開環境・サーバー処理を改善")),
          ]

          used = set()
          for title, candidates in category_rules:
              matches = [x for x in items if x in candidates]
              if matches:
                  sections.append(title + "\n" + "\n".join("・" + x for x in matches))
                  used.update(matches)

          other = [x for x in items if x not in used]
          if other:
              sections.append("📝 その他\n" + "\n".join("・" + x for x in other[:5]))

          if not sections:
              sections = ["今回の更新内容を公開しました。"]

          body = "ACTIS Web が更新されました。\n\n" + "\n\n".join(sections)
          open("/tmp/update.txt", "w", encoding="utf-8").write(body)
          PY

          echo "ユーザー向け更新内容:"
          cat /tmp/update.txt

      - name: Send Discord notification
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_COUNT: ${{ steps.check.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          update = open("/tmp/update.txt", encoding="utf-8").read().strip()
          lines = [line.strip() for line in update.splitlines() if line.strip()]
          description = "\n".join(f"• {line}" for line in lines)
          if len(description) > 4000:
              description = description[:3997] + "..."

          payload = {
              "username": "ACTIS Update",
              "embeds": [{
                  "title": "🚆 ACTIS Web アップデート",
                  "description": description,
                  "url": "https://actis-web.pages.dev/",
                  "footer": {
                      "text": f"ACTIS Web v0.1.0 • {os.environ['COMMIT_COUNT']}件の変更"
                  }
              }]
          }

          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "ACTIS-Update/0.1.0"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  if response.status >= 300:
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"Discord HTTP {error.code}")
              print(f"Discord response: {body}")
              raise
          PY

      - name: Move notification marker
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified
