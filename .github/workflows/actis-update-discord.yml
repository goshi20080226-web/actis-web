name: ACTIS Update Discord

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check update size
        id: check
        shell: bash
        run: |
          set -euo pipefail

          TAG="actis-update-notified"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            BASE="$TAG"
            COUNT="$(git rev-list --count "$BASE..HEAD")"
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            BASE=""
            COUNT="0"
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -ge 5 ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE" ]; then
            FEATURE_COUNT="$(git log --format='%s' "$BASE..HEAD" | grep -Eic '^(feat|feature|add|added|implement|implementation|追加|実装|新機能|機能追加)' || true)"
          else
            FEATURE_COUNT=0
          fi

          if [ "$FEATURE_COUNT" -ge 1 ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize notification marker
        if: steps.check.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified

      - name: Prepare change list
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          git log --format='- %s%n  %b' "actis-update-notified..HEAD" > /tmp/changes.txt
          echo "変更コミット:"
          cat /tmp/changes.txt

      - name: Prepare Japanese update text
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          commits = subprocess.check_output(
              ["git", "log", "--format=%s%x00%b%x00%H", "actis-update-notified..HEAD"],
              text=True,
              encoding="utf-8"
          ).splitlines()

          lines = []
          for entry in commits:
              parts = entry.split("\x00")
              subject = parts[0].strip()
              body = parts[1].strip() if len(parts) > 1 else ""
              commit_hash = parts[2].strip()[:7] if len(parts) > 2 else ""

              if not subject:
                  continue

              lines.append(f"・{subject}")
              if body:
                  for body_line in body.splitlines():
                      body_line = body_line.strip()
                      if body_line:
                          lines.append(f"  {body_line}")

          if not lines:
              raise SystemExit("変更内容を取得できませんでした。")

          open("/tmp/update.txt", "w", encoding="utf-8").write("\n".join(lines))
          PY

          echo "Discord通知内容:"
          cat /tmp/update.txt

      - name: Send Discord notification
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_COUNT: ${{ steps.check.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          update = open("/tmp/update.txt", encoding="utf-8").read().strip()

          payload = {
              "username": "ACTIS Update",
              "embeds": [{
                  "title": "🚆 ACTIS Web アップデート",
                  "description": update,
                  "url": "https://actis-web.pages.dev/",
                  "footer": {
                      "text": f"ACTIS Web v0.1.0 • {os.environ['COMMIT_COUNT']}件の変更"
                  }
              }]
          }

          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              if response.status >= 300:
                  raise SystemExit(f"Discord returned HTTP {response.status}")
          PY

      - name: Move notification marker
        if: steps.check.outputs.initialized == 'true' && steps.check.outputs.should_notify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f actis-update-notified "$GITHUB_SHA"
          git push origin -f actis-update-notified
